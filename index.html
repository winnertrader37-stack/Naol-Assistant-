if(it.sym)return KB.er[lang];
if(it.mk)return await overview();
if(/kaalaandar|calendar|ቀን|guyyaa har|date|session|sa.aatii|ሰዓት|what time/.test(s))return dateTxt();
if(/^(hi|hello|hey|akkam|salaam|selam|ሰላም|ሀሎ)/.test(s))return KB.hi[lang];
return KB.nk[lang]}

async function ask(raw){const q=raw.trim();if(!q||busy)return;busy=true;SP.reset();$('#hero').style.display='none';add('u',esc(q));
const bb=add('b',DOTS),s=q.toLowerCase(),it=intent(s);let a=null,out='';
const done=()=>{busy=false;if(live)setTimeout(listen,300)};
if(live){orb('t');$('#ls').textContent=LS[lang][1]}
ctl=new AbortController();
try{
if(it.sym){cur=it.sym;$('#pair').value=cur;bb.innerHTML=UI[lang].load+' '+DOTS;try{a=await analyze(it.sym)}catch(e){}}
if(!CFG.key){out=(await localReply(s,it,a))||'';bb.innerHTML=out;SP.feed(out);SP.flush(done);$('#chat').scrollTop=1e9;return}
let ctx='';const want=it.side||it.tw;
if(it.sym){if(a){const sd=it.side||a.bias,p=(want&&sd!='WAIT')?a.plan(sd=='BUY'?1:-1):null;
ctx=`Pair ${PAIRS[a.sym]}, 1H, price ${f(a.P)}, bias ${a.bias} (score ${a.sc}), RSI ${a.rsi.toFixed(0)}, ATR ${f(a.atr)}. Reasons: ${a.nt.map(k=>N.en[k]).join('; ')}.`+(p?` Plan ${sd}: entry ${f(p.en)}, SL ${f(p.sl)}, TP1 ${f(p.tp1)}, TP2 ${f(p.tp2)}${p.liq?', liquidity target '+f(p.liq):''}. A plan card is shown under your reply, so don't repeat every number.`:'')}
else ctx='Live market data could not be fetched right now; say so honestly.'}
else if(it.mk){try{ctx=(await overview()).replace(/<[^>]+>/g,'')}catch(e){ctx='Market overview unavailable right now.'}}
const hist=H.slice(-20);while(hist.length&&hist[0].r!='u')hist.shift();
out=await llm([...hist,{r:'u',t:q+(ctx?'\n\n[LIVE DATA]\n'+ctx:'')}],sysP(),(t,all)=>{bb.innerHTML=md(all)+'<span class="cur"></span>';$('#chat').scrollTop=1e9;SP.feed(t);if(live)$('#la').textContent=all});
if(!out.trim())throw new Error('empty response');
let card='';if(a&&want&&(it.side||a.bias!='WAIT'))card=(report(a,it.side||a.bias).match(/<div class="card">[\s\S]*?<\/div>/)||[''])[0];
bb.innerHTML=md(out)+card;$('#chat').scrollTop=1e9;
H.push({r:'u',t:q},{r:'m',t:out});SP.flush(done)
}catch(e){SP.reset();if(e.name!='AbortError')bb.innerHTML='⚠️ '+esc(String(e.message||e))+'<br>'+ERR[lang];else if(!bb.textContent.trim())bb.remove();done()}}

function listen(){if(!live||busy||lrec)return;const r=new SR();lrec=r;r.lang=recLang();r.interimResults=true;let got=false;
r.onstart=()=>{orb('l');$('#ls').textContent=LS[lang][0]};
r.onresult=e=>{let t='',fin=false;for(const x of e.results){t+=x[0].transcript;if(x.isFinal)fin=true}$('#lt').textContent=t;if(fin&&t.trim()){got=true;$('#la').textContent='';r.stop();ask(t)}};
r.onend=()=>{lrec=null;if(live&&!busy&&!got)setTimeout(listen,250)};
r.onerror=e=>{if(/not-allowed|service-not-allowed|language-not-supported/.test(e.error)){stopLive();alert(e.error=='language-not-supported'?'Voice language not supported here → ⚙ → Voice input language: English / Amharic':'Microphone permission needed')}};
try{r.start()}catch(e){lrec=null}}
function startLive(){if(!SR){alert('Voice input: use Chrome / Edge');return}live=true;speak=true;$('#spk').textContent='🔊';$('#lv').classList.add('on');$('#lt').textContent='';$('#la').textContent='';listen()}
function stopLive(){live=false;try{lrec&&lrec.abort()}catch(e){}lrec=null;ctl&&ctl.abort();SP.reset();busy=false;$('#lv').classList.remove('on')}
$('#lvb').onclick=startLive;$('#lx').onclick=stopLive;
$('#orb').onclick=()=>{ctl&&ctl.abort();SP.reset();busy=false;try{lrec&&lrec.abort()}catch(e){}lrec=null;setTimeout(listen,200)};

function shCfg(){$('#sp').value=CFG.prov;$('#sk').value=CFG.key;$('#sm').value=CFG.model;$('#su').value=CFG.url;$('#ss').checked=CFG.search;$('#sr').value=CFG.rl;$('#st').classList.add('on')}
$('#cfg').onclick=()=>{document.body.classList.remove('open');shCfg()};
$('#sp').onchange=()=>$('#sm').value=DM[$('#sp').value];
$('#sx').onclick=()=>$('#st').classList.remove('on');
$('#sv').onclick=()=>{CFG={prov:$('#sp').value,key:$('#sk').value.trim(),model:$('#sm').value.trim()||DM[$('#sp').value],url:$('#su').value.trim(),search:$('#ss').checked,rl:$('#sr').value};try{localStorage.setItem('nt_cfg',JSON.stringify(CFG))}catch(e){}$('#st').classList.remove('on');upd()};
upd();
const IC=['<path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/>','<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4"/>','<path d="M4 5h6a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v13a2 2 0 012-2h6z"/>'];
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('#lg button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));const u=UI[l];$('#h1').textContent=u.h1;$('#in').placeholder=u.ph;$('#dis').textContent=u.dis;
$('#chips').innerHTML=[u.chips[0],GEN[l][0],u.chips[2],GEN[l][1]].map((t,j)=>`<button><svg viewBox="0 0 24 24">${IC[j]}</svg><span>${t}</span></button>`).join('');$('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.querySelector('span').textContent))}
$('#pair').innerHTML=Object.entries(PAIRS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#pair').onchange=e=>cur=e.target.value;
$('#bB').onclick=()=>ask(`${PAIRS[$('#pair').value]} buy ${$('#pair').value}`);$('#bS').onclick=()=>ask(`${PAIRS[$('#pair').value]} sell ${$('#pair').value}`);
const WV='<svg viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 8v8M20 11v2"/></svg>',SD='<svg viewBox="0 0 24 24"><path d="M12 20V5M5 12l7-7 7 7"/></svg>';
$('#go').innerHTML=WV;$('#in').oninput=()=>$('#go').innerHTML=$('#in').value.trim()?SD:WV;
$('#go').onclick=()=>{const v=$('#in').value.trim();if(!v){$('#mic').click();return}$('#in').value='';$('#go').innerHTML=WV;ask(v)};$('#in').onkeydown=e=>{if(e.key=='Enter'&&$('#in').value.trim())$('#go').click()};
$('#pl').onclick=()=>$('#tools').classList.toggle('open');
$('#mn').onclick=$('#tt').onclick=()=>document.body.classList.add('open');$('#sc').onclick=()=>document.body.classList.remove('open');
$('#nc').onclick=()=>{$('#log').innerHTML='';$('#hero').style.display='';speechSynthesis.cancel();H=[];ctl&&ctl.abort();busy=false};
document.querySelectorAll('#lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#spk').onclick=()=>{speak=!speak;$('#spk').textContent=speak?'🔊':'🔇';if(!speak)speechSynthesis.cancel()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$('#mic').onclick=()=>{if(!SR){alert('Voice input: use Chrome / Edge');return}if(rec){rec.stop();return}rec=new SR();rec.lang={am:'am-ET',om:'om-ET',en:'en-US'}[lang];
rec.onstart=()=>$('#mic').classList.add('on');rec.onend=()=>{$('#mic').classList.remove('on');rec=null};rec.onerror=()=>{};
rec.onresult=e=>{speak=true;$('#spk').textContent='🔊';ask(e.results[0][0].transcript)};rec.start()};
let last=0;async function tick(){try{const d=await J(`${B}/api/v3/ticker/price?symbol=${cur}`),p=+d.price,el=$('#tick');el.innerHTML=`${PAIRS[cur]} <b>${f(p)}</b>`;el.classList.remove('up','dn');if(last)el.classList.add(p>=last?'up':'dn');last=p}catch(e){}}
$('#pair').addEventListener('change',()=>last=0);setLang('om');tick();setInterval(tick,5000);
</script></body></html>
